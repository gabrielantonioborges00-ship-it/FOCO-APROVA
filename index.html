<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOCO APROVA</title>
    <!-- Conectando o arquivo de visual profissional -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            FOCO APROVA
        </header>
        
        <div class="content">
            <!-- Bloco da Professora IA configurado -->
            <div class="card" onclick="perguntarProfessora()">
                <h3>🤖 Professora IA Gemini</h3>
                <p>Clique aqui para tirar suas dúvidas de concurso instantaneamente.</p>
            </div>
            
            <!-- Bloco de Simulados configurado -->
            <div class="card" onclick="iniciarSimulado()">
                <h3>📚 Simulados & Questões</h3>
                <p>Clique aqui para treinar com correção automatizada.</p>
            </div>
            
            <div class="card">
                <h3>📊 Desempenho</h3>
                <p>Acompanhe sua evolução e notas ao final dos testes.</p>
            </div>
            
            <button class="btn-main" onclick="iniciarSimulado()">Começar Agora</button>
        </div>
    </div>

    <!-- Conectando o arquivo de funcionalidades -->
    <script src="script.js"></script>
</body>
</html>
